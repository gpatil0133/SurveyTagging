<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Survey Auto-Tagger</title>

<!-- Reverse-proxy sub-path.
     `GET /` rewrites the ST_BASE_PATH line below from SURVEY_TAGGER_PATH_PREFIX
     before serving this file (run.py:_shell_html), so the deployed prefix is
     configuration rather than a string checked into the UI. Left empty — opened
     straight off disk, or served by anything that is not this app — the second
     script infers it from the document's own URL instead.

     Both scripts MUST stay above the stylesheet: <base> only governs the
     elements that follow it, and every asset reference below is relative so
     that it does. -->
<script>window.ST_BASE_PATH = "";</script>
<script>
(function () {
  var b = window.ST_BASE_PATH || "";
  if (!b) {
    /* Nothing injected — fall back to where this document was served from.
       "/apisurveytagging/" and "/apisurveytagging/index.html" both yield
       "/apisurveytagging"; the origin root yields "". */
    b = window.location.pathname.replace(/\/index\.html$/i, "").replace(/\/+$/, "");
  }
  window.ST_BASE_PATH = b;
  /* document.write, not appendChild: <base> has to be in the DOM before the
     parser reaches the first relative href, and an injected node would land
     after the stylesheet had already been resolved against the wrong root. */
  document.write('<base href="' + window.location.origin + b + '/">');
})();
</script>

<link rel="stylesheet" href="static/app.css" />
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>Survey Auto-Tagger</span>
      </div>

      <!-- Direct entry. Real forms so Enter submits natively; these inputs live
           in static markup and are never re-rendered, so typing is never
           interrupted by a state change elsewhere. -->
      <form class="entry" id="corpForm" autocomplete="off">
        <label for="corpInput">Corp</label>
        <input type="text" id="corpInput" inputmode="numeric" placeholder="11224"
               aria-label="Corp number" />
        <button type="submit" class="btn primary sm" id="corpBtn">Load</button>
      </form>

      <form class="entry" id="surveyForm" autocomplete="off">
        <label for="surveyInput">Survey</label>
        <input type="text" id="surveyInput" inputmode="numeric" placeholder="1"
               aria-label="Survey number" />
        <button type="submit" class="btn sm" id="surveyBtn">Go</button>
      </form>
    </div>

    <!-- Right-hand group. The wrapper is deliberately class-less and inline
         styled: header.topbar is `justify-content: space-between`, so leaving
         three bare children here would strand the status text in the middle of
         the bar. Grouping keeps the topbar a two-child flex row exactly as the
         shell grid expects. -->
    <div style="display:flex;align-items:center;gap:12px">
      <div class="totals" id="topStatus"></div>

      <button class="icon-btn" id="themeBtn" type="button" aria-pressed="false"
              data-action="toggle-theme" title="Toggle dark mode"
              aria-label="Toggle dark mode">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true" focusable="false">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>

      <button class="icon-btn" id="densityBtn" type="button" aria-pressed="false"
              data-action="toggle-density" title="Toggle compact density"
              aria-label="Toggle compact density">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
          <line x1="4" y1="6" x2="20" y2="6" />
          <line x1="4" y1="12" x2="20" y2="12" />
          <line x1="4" y1="18" x2="20" y2="18" />
        </svg>
      </button>
    </div>
  </header>

  <div id="busybar" aria-hidden="true"></div>

  <aside class="sidebar">
    <div class="top-tabs" id="topTabs">
      <div class="top-tab" data-action="set-topview" data-topview="surveys"
           role="button" tabindex="0">Surveys</div>
      <div class="top-tab" data-action="set-topview" data-topview="tenant"
           role="button" tabindex="0">Tenant</div>
    </div>

    <input type="text" id="navSearch" class="nav-search" placeholder="Filter surveys…"
           aria-label="Filter surveys" hidden />
    <div id="navFilters" hidden></div>
    <div class="sidebar-heading" id="sidebarHeading">Surveys</div>
    <ul class="survey-list" id="nav"></ul>
  </aside>

  <main class="workspace" id="workspace">
    <div id="banner"></div>
    <div id="content"></div>
  </main>

</div>

<!-- Floating activity ribbon. Deliberately outside .app: a fixed element here
     cannot take part in the shell grid, so showing it can never move the
     topbar or sidebar. -->
<div id="ribbon" role="status" aria-live="polite" hidden></div>

<div id="toasts" aria-live="polite"></div>

<noscript>
  <p style="padding:24px">This tool needs JavaScript enabled.</p>
</noscript>

<!-- Relative, so the <base> injected in <head> resolves them under whatever
     sub-path this app is mounted at. -->
<script src="static/render.js"></script>
<script src="static/app.js"></script>
</body>
</html>
