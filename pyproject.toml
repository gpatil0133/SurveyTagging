[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# The code is a flat set of top-level modules (run.py, service.py, bootstrap.py,
# taggers/, pipeline/, ...), deployed by copying the folder and started with
# `python run.py` behind IIS — it is not installed as a distribution. Declaring a
# `survey_tagging` package here built an EMPTY wheel and pointed the console
# script at `survey_tagging.main:cli`, an import path that does not exist.
# `py-modules = []` says "no importable package" explicitly rather than letting
# setuptools guess; the [project.scripts] entry is gone for the same reason.
[tool.setuptools]
py-modules = []

[project]
name = "survey-tagging"
version = "0.1.0"
description = "Automated survey tagging system for multi-tenant survey platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    # Imported directly by run.py and main.py to hop .env into os.environ, which
    # pydantic-settings does not do — litellm and parallel-web read their keys
    # from the environment, not from Settings. It arrives transitively via
    # pydantic-settings today; declared here because we import it by name.
    "python-dotenv>=1.0",
    "pyarrow>=14.0",
    # SMB client. Lets SURVEY_TAGGER_SHARE_ROOT be a UNC path
    # (//server/share/...) that the process opens itself, instead of requiring
    # a root-owned CIFS mount on the host. See sharefs.py.
    "smbprotocol>=1.15",
    "pandas>=2.1",
    "litellm>=1.30",
    "jinja2>=3.1",
    "click>=8.1",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.7",
    "parallel-web>=0.5.0",
    # Kept for pandas/pyarrow, which require it; no module imports it directly
    # any more (V9 removed the only one, llm/embeddings.py).
    "numpy>=1.26",
    "rapidfuzz>=3.0",
    # V9 dropped "sentence-transformers>=3.1,<6" — and with it torch and
    # transformers, by far the largest thing in the image. It backed the
    # embedding ranker that cut the tenant's journey to a per-question top-4;
    # the journey is now inlined whole into the question prompt and the LLM
    # selects from it. The `<6` ceiling and `>=3.1` floor existed to dodge a
    # meta-tensor init crash across the torch/transformers boundary — a
    # compatibility surface this project no longer has.
    "httpx>=0.27",
    "PyJWT[crypto]>=2.8.0",
    # Lets the SoGo client verify TLS against the OS trust store
    # (Windows/macOS/Linux). Required when SoGo intuc serves a cert chained
    # to a corporate root CA that's installed in the OS trust store but not
    # in Python's bundled `certifi` — the default path would fail with
    # CERTIFICATE_VERIFY_FAILED otherwise.
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.21",
]
# IIS FastCGI fallback only — `pip install -e .[iis]`. NOT needed for the
# supported Windows deployment, which is uvicorn behind an ARR reverse proxy
# and imports nothing extra. Install this only when ARR is unavailable and
# wsgi_app.py is doing the hosting. See docs/deployment-iis.md §9.
iis = [
    "a2wsgi>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
