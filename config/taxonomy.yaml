# Master Survey Tagging Taxonomy (V8 — aligns the vocabulary to the widget API)
# Defines tag dimensions across tenant, project, and question levels.
#
# ---------------------------------------------------------------------------
# What V8 changed, and why
#
# The goal was narrow: every tag a dashboard composer reads should resolve to a
# field the /Widget/insertupdate payload actually accepts, without guessing.
# Six dimensions were added, seven reshaped, eight values dropped.
#
#   Phase 1  response_format was branching on question_type alone, collapsing
#            five distinct question shapes into Open-Text — a numeric "how many
#            days since your last visit?" became a word cloud. It now reads
#            question_sub_type too, adding Date, Numeric-Open and File-Upload
#            and widening Contact to absorb the email sub-type. scale_of_
#            measurement's Ratio, emitted by nothing before, gets its first
#            source. Everything below the anchor inherited that error, so this
#            phase had to land before the other two meant anything.
#
#   Phase 2  metricType is required on every widget insert and nothing here
#            could produce one. platform_metric (NEW) carries the ordered code
#            list; calculation_type became a COARSENING of it rather than a
#            second opinion, so the two cannot drift. Weighted Score — the
#            platform default for every grid and rating question, and the most
#            used code there is — was missing entirely.
#
#   Phase 3  The chart vocabulary moved onto the platform's own names.
#            Orientation is not cosmetic: horizontal and vertical are separate
#            codes, and for a grid question the two stacked variants are the
#            ONLY legal charts. Four values with no code behind them were
#            dropped (Heat Map, Distribution Chart, Sentiment, Map) along with
#            two that were something else wearing a chart's name (Trend Line is
#            a display mode; Ranking Bar is a horizontal bar with a Weighted
#            Score metric).
#
#   Phase 4  Six payload fields no dimension spoke to: favorable_options,
#            trend_granularity, widget_footprint, preferred_segments,
#            display_label, plus a shape change to segment_dimensions.
#
# Phase 0 remains OPEN and gates one value. Our question_sub_type enum
# (1 date, 31 email, 71 file upload) is not RMX's qSubType enum (1-5 for date /
# time / datetime / date-range / statistical), and our numeric/statistical code
# has not been enumerated from live payloads. `Numeric-Open` is declared and
# wired but unreachable until it is; see taggers/_sub_types.py, where turning it
# on is a one-line change. `Ratio` and `Sum` depend on it.
# ---------------------------------------------------------------------------
#
# V6 added: tenant_level (compliance_posture, customer_segment_signature,
#          workforce_signature, ex_maturity_signature, key_cx_touchpoints,
#          key_ex_lifecycle_stages). Tenant-level tags are persisted once
#          per tenant in output/{tenant_id}/tenant_tags.json — not duplicated
#          on every per-survey tagged_output.json.
#
# ---------------------------------------------------------------------------
# The explanation layer (V7)
#
# Every dimension carries five extra fields, served by GET /api/taxonomy and
# rendered as columns in the UI's Taxonomy tab. They answer the questions a
# reader has when they meet a tag for the first time:
#
#   explanation  What this dimension IS, in plain language — what it means and
#                what downstream consumers do with it.
#   derivation   WHERE the value comes from: which inputs are read, the shape
#                of the logic, the tagger module, and who gets the final say.
#   strategy     One-word label for that derivation, one of:
#                  deterministic  rules over platform signals; final.
#                  statistical    computed from response data.
#                  hybrid         rules + keyword/regex heuristics; final.
#                  llm-refined    a rule writes a prior, an LLM call may override.
#                  llm-only       only the LLM can produce the value.
#                  placeholder    no signal source yet; a constant or empty value.
#   purpose      WHY the dimension exists, in one line. The short answer to
#                "what is this for?" — `explanation` is the long one. Kept in
#                sync with the per-level "Purpose in one line" tables in
#                docs/dimension-reference.md.
#   feeds        WHICH outcome consumes the value. A list, most-immediate
#                consumer first. Six of the tokens are the planned
#                experience-platform services (architecture/02-experience-
#                platform-services.md); three describe consumption today:
#                  S1         Onboarding & Goal Prediction
#                  S2         Survey Program Recommender
#                  S3         Dashboard Composer
#                  S4         Journey Builder
#                  S5         Customer Profiling
#                  S6         Recommendations, Alerts & Actions
#                  Pipeline   another tagger or an LLM prompt inside THIS
#                             service reads it (live, verifiable in-repo)
#                  Reporting  read from the artifact / rendered by the survey
#                             view by an existing reader (live)
#                  None       nothing consumes it yet — placeholder dimensions
#                Only Pipeline and Reporting are live; S1–S6 are designed, not
#                built, so `feeds` is a contract, not an observed dependency.
#
# `description` is left as the terse backend-facing line it has always been —
# `explanation` is the human one. None of the five is enforced; all are
# documentation. Keep `derivation` honest: when a rule is a stub or a fallback,
# say so. The per-dimension deep dive (including known weaknesses) lives in
# docs/tagging-logic-audit.md; the long-form "purpose / where used" prose lives
# in docs/dimension-reference.md.
# ---------------------------------------------------------------------------

tenant_level:
  compliance_posture:
    description: "Tenant's regulatory compliance signature; backend uses this to set anonymization defaults and identifier policies."
    purpose: "Sets anonymization and identifier policy for the whole account."
    feeds: [Reporting, S1, S6]
    strategy: deterministic
    explanation: >-
      The regulatory regime the whole account operates under. Downstream this sets
      anonymization defaults and identifier-handling policy for every survey the
      tenant runs, so it is decided once per tenant rather than per survey.
    derivation: >-
      Rules over the Parallel.ai org profile (`regulatory_frameworks`,
      `regulatory_intensity`). A substring map normalizes framework names
      (hipaa->HIPAA, gdpr/ccpa->GDPR, soc2->SOC2, ferpa, pci); two or more distinct
      frameworks -> Multi-Regulatory, exactly one -> that framework, none recognized
      but High intensity -> Multi-Regulatory, otherwise None. Confidence tracks the
      profile's regulatory intensity. No profile -> None at low confidence.
      taggers/tenant/compliance_posture.py; never LLM-refined.
    allowed_values:
      - None
      - GDPR
      - HIPAA
      - SOC2
      - FERPA
      - PCI
      - Multi-Regulatory

  customer_segment_signature:
    description: "Normalized customer segment shape. Backend uses this to prioritize default segmentation dimensions."
    purpose: "Prioritizes which segmentation dimensions a dashboard offers by default."
    feeds: [S1, S3, S5]
    strategy: deterministic
    explanation: >-
      The shape of who this tenant sells to — enterprise B2B, SMB B2B, consumers, or
      a mix. Used to prioritize which segmentation dimensions a dashboard offers by
      default.
    derivation: >-
      Substring flags over the CX profile's `primary_customer_segment` and
      `secondary_customer_segments` (b2b/enterprise/smb/b2c/consumer/retail), unioned
      across both; two or more distinct signals -> B2B2C or Mixed. Confidence from
      `cx_confidence`. No profile -> N/A.
      taggers/tenant/customer_segment_signature.py; never LLM-refined.
    allowed_values:
      - B2B-Enterprise
      - B2B-SMB
      - B2C
      - B2B2C
      - Mixed
      - N/A

  workforce_signature:
    description: "Workforce composition shape. Backend uses this to select EX dashboard layout (frontline-ops vs knowledge-engagement)."
    purpose: "Picks the EX dashboard layout and the channel an EX program is reached on."
    feeds: [S2, S3, S5]
    strategy: deterministic
    explanation: >-
      What the tenant's workforce looks like — frontline-heavy, knowledge workers,
      field, distributed, or hybrid. Picks which EX dashboard layout is shown
      (frontline-ops vs knowledge-engagement).
    derivation: >-
      Banding of the EX profile's `frontline_ratio`, `work_arrangement` and
      `workforce_composition` literals. A high frontline band dominates
      (Frontline-heavy); otherwise the work arrangement decides
      (remote/distributed -> Distributed, field -> Field, hybrid -> Hybrid); a
      knowledge/professional composition or a low frontline band -> Knowledge.
      No usable profile -> N/A. taggers/tenant/workforce_signature.py.
    allowed_values:
      - Frontline-heavy
      - Knowledge
      - Hybrid
      - Field
      - Distributed
      - N/A

  ex_maturity_signature:
    description: "Tenant's EX program maturity. Backend uses this to pick dashboard complexity (simple vs full driver/cross-tab)."
    purpose: "Picks EX dashboard complexity, and the maturity roadmap baseline."
    feeds: [S1, S3]
    strategy: deterministic
    explanation: >-
      How far along the tenant's employee-experience program is. Drives how complex
      the EX dashboard should be — a simple scorecard for a foundational program, the
      full driver and cross-tab treatment for an advanced one.
    derivation: >-
      Ordered substring match on the EX profile's `ex_maturity_level`
      (advanced/mature/optimized -> Advanced, established/intermediate -> Established,
      developing/emerging -> Developing, foundational/basic/nascent -> Foundational);
      first hit wins. Unrecognized or missing -> N/A.
      taggers/tenant/ex_maturity_signature.py.
    allowed_values:
      - Foundational
      - Developing
      - Established
      - Advanced
      - N/A

  key_cx_touchpoints:
    description: "Flat list of semantic CX touchpoint / journey-stage names extracted from tenant_profile.cx_journeys. Used by backend to align widgets with tenant-specific touchpoints."
    purpose: "The tenant's own CX vocabulary for widgets and journey views."
    feeds: [S2, S4]
    strategy: deterministic
    explanation: >-
      The tenant's own customer touchpoint names, in their words. Lets widgets and
      journey views line up with the vocabulary the customer already uses instead of
      a generic industry stage list.
    derivation: >-
      Walks `cx_journeys[]` in the tenant profile, collecting both stage names and
      touchpoint names (string or dict entries), Title-Cases them and dedupes while
      preserving order. Confidence from `cx_journeys_confidence` or `cx_confidence`.
      taggers/tenant/key_cx_touchpoints.py.
    multi_label: true
    user_defined: true

  key_ex_lifecycle_stages:
    description: "Flat list of semantic EX lifecycle stage names from tenant_profile.ex_lifecycle_stages. Used by backend to align EX widgets."
    purpose: "The EX counterpart of key_cx_touchpoints."
    feeds: [S2, S4]
    strategy: deterministic
    explanation: >-
      The tenant's own employee-lifecycle stage names (hire, onboard, develop, exit,
      as they call them). The EX counterpart of key_cx_touchpoints.
    derivation: >-
      Reads each entry of `ex_lifecycle_stages[]` in the tenant profile, taking
      `name` / `stage_name` / `stage`, Title-Casing and deduping. Same confidence map
      as key_cx_touchpoints. taggers/tenant/key_ex_lifecycle_stages.py.
    multi_label: true
    user_defined: true


project_level:
  project_type:
    description: "Survey program type (CX/EX/general Survey/Assessment). Renamed from `category` in V6."
    purpose: "The top-level branch nearly everything else reads first."
    feeds: [Pipeline, Reporting, S1, S2, S3, S4, S5, S6]
    strategy: deterministic
    explanation: >-
      Which program the survey belongs to. This is the top-level branch almost every
      other tagger reads first — CX and EX surveys take different journey canons,
      dashboards, audiences and sub-types.
    derivation: >-
      Direct map of the platform's own `survey_type` field (Survey/CX/EX/Assessment;
      Poll -> Survey). Anything unrecognized falls back to Survey. Stage 1,
      taggers/project/project_type.py. Never LLM-refined.
    allowed_values:
      - Survey
      - CX
      - EX
      - Assessment

  survey_cadence:
    description: "Deployment frequency pattern"
    purpose: "How often it actually ships - trend windows and fatigue caps."
    feeds: [Pipeline, S2, S3, S6]
    strategy: statistical
    explanation: >-
      How often the survey actually goes out — once, on a repeating schedule,
      continuously, or whenever someone feels like it. Read from behaviour, not from
      a setting, so it reflects what happened rather than what was intended.
    derivation: >-
      Computed from response timestamps and invitation types. Fewer than 5 responses
      -> Ad-hoc; a span of 14 days or less -> One-time; a long span with a small
      median gap, or a majority of shareable-URL invitations -> Always-on; gap-based
      clustering with consistent inter-cluster spacing -> Recurring; otherwise
      Ad-hoc. Stage 2, taggers/project/cadence.py. Never LLM-refined.
    allowed_values:
      - One-time
      - Recurring
      - Always-on
      - Ad-hoc

  relationship_type:
    description: "Nature of the respondent relationship being measured"
    purpose: "Transaction vs relationship vs journey vs pulse; implies the follow-up window."
    feeds: [Pipeline, S2, S6]
    strategy: llm-refined
    explanation: >-
      What kind of relationship the survey measures: a single transaction just
      completed, an ongoing relationship, a whole journey, or a recurring pulse
      check. It is the difference between "how was checkout?" and "how are we doing?".
    derivation: >-
      Hybrid cascade over structure and title text — three or more section headers ->
      Journey-based; a short survey on a Recurring cadence -> Pulse; transactional
      phrases in the title or first questions ("recent visit", "after your") ->
      Transactional; NPS plus an overall-satisfaction question -> Relational; then
      the CX profile's own relationship type when its confidence is High; fallback
      Relational. Stage 4, taggers/project/relationship.py — LLM Call 1 sees the
      result as a hint and may override it.
    allowed_values:
      - Transactional
      - Relational
      - Journey-based
      - Pulse

  project_purpose:
    description: "Primary business objective of the survey"
    purpose: "The business question the survey answers; the portfolio grouping key."
    feeds: [Pipeline, S1, S2]
    strategy: llm-refined
    explanation: >-
      The business question the survey exists to answer. The single most useful
      dimension for grouping surveys across an account, and the one a human would
      write first if asked "why did you run this?".
    derivation: >-
      Hybrid keyword cascade: EX projects -> Employee Engagement; then title keyword
      groups (loyalty/nps -> Measure Loyalty, churn/exit -> Understand Churn /
      Retention, event/conference -> Event / Program Feedback, ...); then the
      caller-supplied purpose; then metric presence (NPS -> Measure Loyalty, CSAT ->
      Product / Service Feedback); a low-confidence Product / Service Feedback seed
      when nothing matches. Stage 4, taggers/project/purpose.py — in practice LLM
      Call 1 decides the final value, since every rule branch is overridable.
    allowed_values:
      - Measure Loyalty
      - Understand Churn / Retention
      - Product / Service Feedback
      - Employee Engagement
      - Onboarding / Training
      - Market Research / VOC
      - Compliance / Audit
      - Event / Program Feedback

  project_intent:
    description: "Short free-text statement of what THIS survey is trying to find out"
    purpose: "What THIS survey asks about, in <=8 words of the customer's language."
    feeds: [Reporting, S1, S2]
    strategy: llm-only
    explanation: >-
      The survey's intent in a handful of words — "Branch visit feedback",
      "Post-discharge care follow-up", "New-hire onboarding check-in". Where
      project_purpose picks one of eight business objectives, this names the specific
      subject or moment being asked about, at the granularity a person would use to
      describe the survey in one line. Free text on purpose: an enum cannot hold
      "branch visit".
    derivation: >-
      LLM Call 1 writes it (max 8 words) from the title, description, section headers
      and question mix. The tagger only seeds a fallback from the survey title with
      the boilerplate stripped ("2026 Branch Visit Feedback Survey" -> "Branch Visit
      Feedback"), held at 0.45 so the call always wins; with no usable title it
      returns pending_llm. Stage 4, taggers/project/project_intent.py. user_defined,
      so the value is never enum-checked — only trimmed and length-capped.
    allowed_values: []
    user_defined: true

  lifecycle_status:
    description: "Current deployment state of the survey"
    purpose: "Whether the numbers are still moving."
    feeds: [Reporting, S3, S4]
    strategy: deterministic
    explanation: >-
      Where the survey is in its own life: still being built, live and collecting, or
      closed. Consumers use it to decide whether numbers are still moving.
    derivation: >-
      Date arithmetic on the platform's start/end dates against now — start in the
      future -> Edit, end in the past -> Expired, otherwise Active. With no dates,
      responses present -> Active, else Edit. Stage 1,
      taggers/project/lifecycle.py. Never LLM-refined.
    allowed_values:
      - Edit
      - Active
      - Expired

  audience_type:
    description: "Target respondent group"
    purpose: "Customers vs employees - gates dashboards and journey canon."
    feeds: [Pipeline, S3, S5, S6]
    strategy: llm-refined
    explanation: >-
      Who is being asked — the tenant's customers, a bought panel, its own employees,
      or a mix. Gates which dashboards and which journey canon (CX vs EX) apply.
    derivation: >-
      EX -> Internal - Employees; CX -> External - Customers; Assessment -> Internal;
      a caller-supplied purpose mentioning employees -> Internal; otherwise a keyword
      vote across all question titles (ten internal vs ten external terms, the winner
      needing at least two hits and a majority); fallback External - Customers.
      Stage 1, taggers/project/audience.py — LLM Call 1 may override, and is the only
      source of External - Panel and Mixed.
    allowed_values:
      - "External – Customers"
      - "External – Panel"
      - "Internal – Employees"
      - Mixed

  industry_vertical:
    description: "Industry domain of the survey (free text — the researcher's own words when a profile supplies them)"
    purpose: "Selects the industry journey template and the benchmark family."
    feeds: [Pipeline, S1, S2]
    strategy: hybrid
    explanation: >-
      The industry the survey is run in, in the words of whichever source knew it
      best. Free text rather than an enum: the research agent already returns a
      precise label ("Healthcare & Life Sciences", "Regional Retail Banking") and
      collapsing that onto a ten-value list threw away the only part worth reading.
      Familiar shapes — Healthcare, Financial Services, Retail / E-commerce, Higher
      Education, K-12 Education, SaaS / Technology, Hospitality / Travel, Fitness &
      Wellness, Government / Public Sector — are examples, not a closed set.
    derivation: >-
      The tenant profile decides when it has an answer: the org research agent's
      industry is stored VERBATIM (with its sub-vertical when it names one) at a
      confidence above the LLM override threshold, so Call 1 leaves it alone — a
      researched label is not something a survey-text reader improves on. With no
      profile the tagger only seeds a guess — the Directory's `inferred_domains`,
      a caller-supplied override, then keyword scoring over the survey and question
      titles, and Other when nothing matches — all held below that threshold, so
      LLM Call 1 rewrites it. Stage 1, taggers/project/industry.py. user_defined,
      so the value is never enum-checked — only trimmed and length-capped.
    allowed_values: []
    user_defined: true

  ai_assist_flag:
    description: "How the survey was created"
    purpose: "Authoring provenance. Not yet derivable - every value reads Manual."
    feeds: [None]
    strategy: placeholder
    explanation: >-
      Whether a person wrote the survey, wrote it with AI help, or had AI generate it
      outright. Intended for provenance reporting on authored content.
    derivation: >-
      Placeholder — no authoring signal reaches the pipeline yet, so the tagger
      returns Manual unconditionally at low confidence
      (taggers/project/ai_assist.py, Stage 2). AI-Created and AI-Assisted are
      unreachable until the platform exposes how the survey was built.
    allowed_values:
      - AI-Created
      - AI-Assisted
      - Manual

  program_initiative:
    description: "User-defined label grouping surveys under one business initiative"
    purpose: "The customer's own initiative label. Human input."
    feeds: [None]
    strategy: placeholder
    explanation: >-
      The customer's own label for the initiative a group of surveys belongs to
      ("FY26 Onboarding Revamp"). Deliberately a human judgement, not a system one —
      no signal in the survey can tell you which internal programme funded it.
    derivation: >-
      Placeholder for user input. The tagger always emits an empty value so the
      dimension is present in the output for a person (or a future platform field) to
      fill. Stage 1, taggers/project/program.py.
    allowed_values: []
    user_defined: true

  respondent_segments:
    description: "Respondent attributes from the linked directory that this survey's results can be broken out by, with their distinct values."
    purpose: "The segment picker: WHO answered, in the vocabulary a report can group by."
    feeds: [Reporting, S3, S5]
    strategy: deterministic
    explanation: >-
      The respondent attributes a report can cut this survey's results by — department,
      location, membership status, gender — each with the values it actually takes.
      Where segment_dimensions says which QUESTION can slice others, this says which
      properties of the PERSON are available to slice by.
    derivation: >-
      Read from the tenant's Directory/ parquet files, narrowed to the directories
      this survey's responses are joined to via directory_linking.parquet. A column
      qualifies when it has 2-15 distinct values and is not an identifier, name,
      email, phone, address or date of birth — those are excluded by rule and their
      values are never emitted. Skipped with evidence when the survey has no
      directory link, since an attribute that cannot reach a response cannot group
      one. Stage 2, taggers/project/respondent_segments.py. Never LLM-refined.
    multi_label: true
    allowed_values: []
    user_defined: true
  owner_team:
    description: "Department, team, or individual accountable for the project"
    purpose: "Who answers for the results. The address on a routed action."
    feeds: [S6]
    strategy: placeholder
    explanation: >-
      Who owns the survey and answers for its results. Used for routing and
      accountability views rather than for analysis.
    derivation: >-
      Placeholder for user input. The earlier auto-suggestion read the account
      owner's name from the retired CorporateData file; the tenant profile carries no
      contact identity, so nothing is suggested today. Stage 1,
      taggers/project/owner_team.py.
    allowed_values: []
    user_defined: true

  # --- V2 Additions (project-level) ---

  survey_sub_type:
    description: "Detailed survey sub-classification within CX/EX"
    purpose: "Which instrument inside the CX/EX program."
    feeds: [Pipeline, S2, S3]
    strategy: llm-refined
    explanation: >-
      The finer classification inside the CX/EX programme — a pulse, a lifecycle
      moment, a 360, a touchpoint study. Where project_type says which programme,
      this says which instrument.
    derivation: >-
      Keyword cascade over the title and description, branched by project_type. EX:
      pulse -> Pulse, onboarding/exit/anniversary -> Lifecycle, 360 -> 360 Feedback,
      manager/leadership -> Manager Effectiveness, culture/dei -> Culture, else
      Engagement. CX: journey -> Journey, transaction/post- -> Transactional,
      touchpoint/website/store -> Touchpoint, product/feature -> Product / Service,
      recurring cadence -> Relationship, else Transactional. Survey/Assessment:
      market research/voc -> Market Research, else Ad Hoc. Stage 4,
      taggers/project/sub_type.py — LLM Call 1 may override.
    allowed_values:
      - Transactional
      - Relationship
      - Touchpoint
      - Journey
      - Pulse
      - Engagement
      - Lifecycle
      - "360 Feedback"
      - Culture
      - "Manager Effectiveness"
      - "Product / Service"
      - "Market Research"
      - "Ad Hoc"

  dashboard_routing:
    description: "Which dashboards this survey should appear on (multi-label)"
    purpose: "Which dashboards the survey feeds; the allow-list for question placement."
    feeds: [Pipeline, S3]
    strategy: llm-refined
    explanation: >-
      Which dashboards this survey feeds. Also acts as the allow-list that the
      question-level dashboard_placement is supposed to stay inside — a question
      cannot be routed somewhere the survey itself does not go.
    derivation: >-
      Additive rules, all at flat confidence: NPS or CSAT present -> Executive
      Dashboard; EX -> Employee Engagement Dashboard (plus HR Dashboard when the
      audience is employees); CX -> Customer Experience Dashboard; any open-text
      question -> Voice of Customer/Employee Dashboard; nothing collected -> a safety
      floor so the list is never empty. Stage 4,
      taggers/project/dashboard_routing.py — LLM Call 1 union-merges the names it
      suggests and never removes a rule-derived one.
    multi_label: true
    allowed_values: []
    user_defined: true
    canonical_values:
      - Executive Dashboard
      - Operations Dashboard
      - Customer Experience Dashboard
      - Employee Engagement Dashboard
      - Voice of Customer Dashboard
      - Voice of Employee Dashboard
      - HR Dashboard
      - Manager Effectiveness Dashboard

question_level:
  topic_theme:
    description: "Subject matter of the question"
    purpose: "The subject axis you group results along."
    feeds: [S3, S5, S6]
    strategy: llm-refined
    explanation: >-
      What the question is about, subject-wise. The axis you group questions along
      when reading a survey's results — "everything about onboarding", "everything
      about pay".
    derivation: >-
      A keyword seed only: a demographics regex, then seven theme keyword lists
      (manager/leadership, compensation, culture, onboarding, pricing, competitor,
      brand), then service and product terms, else a default chosen from the project
      context. Every branch is deliberately below the override threshold, so the real
      value comes from LLM Call 2, which reads the question text and options.
      Stage 5, taggers/question/topic_theme.py.
    allowed_values:
      - Product Experience
      - "Service / Support"
      - Onboarding
      - "Manager / Leadership"
      - "Culture & Belonging"
      - "Compensation & Benefits"
      - "Brand & Perception"
      - "Pricing & Value"
      - "Competitor / Market"
      - Demographics

  role_intent:
    description: "Analytical function of the question within the survey"
    purpose: "The job the question does; the most-read question dimension."
    feeds: [Pipeline, S3, S5]
    strategy: llm-refined
    explanation: >-
      The job the question does in the analysis — is it the headline metric, a driver
      that explains it, the verbatim behind it, a screener, or a demographic you cut
      by? Many other question dimensions branch on this one.
    derivation: >-
      A long cascade over platform signals, strongest first: rs_type 2/3/4 -> Primary
      Metric; the custom-metric flag; a follow-up flag -> Follow-up / Verbatim;
      contact/email types and demographic title patterns -> Profiling / Demographic;
      the key-driver flag and grid types -> Driver / Attribute; unweighted choice
      types -> Segmentation; text late in the survey -> Verbatim, else Diagnostic;
      fallback Segmentation. Stage 3, taggers/question/role_intent.py — LLM Call 2
      refines it only when the rule landed below 0.70 confidence.
    allowed_values:
      - Primary Metric
      - "Driver / Attribute"
      - "Follow-up / Verbatim"
      - Diagnostic
      - "Outcome / Behavioral Intent"
      - Segmentation
      - "Profiling / Demographic"
      - Screener
      - "Contextual / Situational"
      - Benchmarkable
      - "Compliance / Consent"
      - Validation

  data_sensitivity:
    description: "PII or sensitive data classification"
    purpose: "PII classification - masking, retention, access."
    feeds: [Reporting, S6]
    strategy: deterministic
    explanation: >-
      What personal or sensitive data an answer to this question would capture. The
      flag anonymization, retention and access rules key off — the one dimension
      where a false negative has a compliance cost.
    derivation: >-
      Regex over the question title and its matrix stem across seven categories
      (name, email, phone, location, ID/SSN, health, financial), plus an
      income-plus-currency-options check; the platform's email sub-type is taken
      directly. No category matches -> Anonymous-safe. Multi-label: a question can
      carry several. Stage 3, taggers/question/data_sensitivity.py. Never
      LLM-refined.
    multi_label: true
    allowed_values:
      - "PII – Name"
      - "PII – Email"
      - "PII – Phone"
      - "PII – Location"
      - "PII – ID"
      - "Sensitive – Health"
      - "Sensitive – Financial"
      - Anonymous-safe

  respondent_sensitivity:
    description: "Impact on respondent experience"
    purpose: "What the question costs the respondent; what to cut when a survey is too long."
    feeds: [S2]
    strategy: llm-refined
    explanation: >-
      What the question costs the person answering it — emotional load, political
      risk, sheer effort, or nothing much. Used when judging survey length and where
      drop-off is likely.
    derivation: >-
      A structural prior from role_intent and question shape: primary metrics ->
      High Analytical Weight; key drivers; a matrix over eight rows ->
      Effort-intensive; segmentation and demographic roles -> Optional / Low Stakes.
      Stage 5, taggers/question/respondent_sensitivity.py — LLM Call 2 refines the
      weaker branches and is the only source of Emotionally Sensitive and
      Politically Sensitive, which no rule can detect.
    allowed_values:
      - Emotionally Sensitive
      - Politically Sensitive
      - Effort-intensive
      - "Optional / Low Stakes"
      - High Analytical Weight

  flow_placement:
    description: "Position within the survey flow"
    purpose: "Positional slot in the respondent's path."
    feeds: [Pipeline, S2]
    strategy: deterministic
    explanation: >-
      Where the question sits in the respondent's path through the survey. Purely
      positional — it says where, not why.
    derivation: >-
      Arithmetic on the question's position ratio among non-content questions: 0.0 ->
      Opening, up to 0.15 -> Warm-up, up to 0.75 -> Core Block, up to 0.90 -> Deep
      Dive, beyond -> Closing; a single-question survey -> Standalone. Stage 3,
      taggers/question/flow_placement.py. Never LLM-refined.
    allowed_values:
      - Opening
      - Warm-up
      - Core Block
      - Deep Dive
      - Closing
      - Standalone

  flow_logic_role:
    description: "Role in survey branching and logic"
    purpose: "Part played in the branching/piping machinery."
    feeds: [S2]
    strategy: hybrid
    explanation: >-
      The part the question plays in the survey's branching and piping machinery —
      what it triggers, what it feeds, what it can end. Empty for the majority of
      questions, which simply sit in the flow. Read `source` before acting on a
      value: the survey payload carries no logic definitions, so some entries are
      platform facts and some are a model's reading of the wording.
    derivation: >-
      Two passes, unioned. Stage 3 (taggers/question/flow_logic.py, deterministic,
      0.90) reads the platform's own signals: a hidden-routing question -> Branching
      Trigger; a follow-up -> Branching Target; piping markers in the text -> Piping
      Target; being named as another question's parent metric -> Piping Source; an
      early yes/no -> Termination Trigger. Stage 5 (LLM Call 2, 0.55) may ADD
      Branching Trigger, Skip Logic Source, Termination Trigger or Loop Trigger when
      the wording reads like a gate, screener or loop setup — the other four values
      are never inferable and the call may never remove a structural entry. A tag
      holding both reads source=hybrid; the evidence names which pass produced each
      role. Multi-label; empty list when none apply. Quota Controller is currently
      unreachable — nothing in the payload reveals a quota.
    multi_label: true
    allowed_values:
      - Branching Trigger
      - Branching Target
      - Skip Logic Source
      - Piping Source
      - Piping Target
      - Loop Trigger
      - Termination Trigger
      - Quota Controller

  flow_dependency:
    description: "Dependency relationships with other questions"
    purpose: "Whether its response base is the full sample."
    feeds: [S3, S5]
    strategy: deterministic
    explanation: >-
      How this question depends on what came before it — shown only under a
      condition, carrying an earlier answer forward, part of a block, or entirely
      free-standing. Tells you whether its response base is the full sample.
    derivation: >-
      Single-value cascade over the same linkage signals as flow_logic_role: a
      follow-up -> Conditionally Shown; piping markers -> References Prior; matrix
      membership -> Mutually Exclusive Block; being referenced by a follow-up ->
      Carries Forward; otherwise Independent. Stage 3,
      taggers/question/flow_dependency.py. Never LLM-refined.
    allowed_values:
      - Independent
      - Conditionally Shown
      - Conditionally Required
      - Carries Forward
      - References Prior
      - Mutually Exclusive Block

  flow_respondent_experience:
    description: "Effect on respondent engagement and flow"
    purpose: "Effect on engagement at that point in the flow."
    feeds: [S2]
    strategy: llm-refined
    explanation: >-
      What the question does to engagement at that point in the flow — reassures,
      marks progress, re-engages a tiring respondent, or taxes them.
    derivation: >-
      Structural prior from flow_placement, matrix size and metric type: an opening
      question -> Trust Builder; a matrix over six rows -> Effort Checkpoint; a late
      NPS/CSAT -> Progress Anchor; a text question after a run of ratings ->
      Re-engagement Point. Stage 5, taggers/question/flow_experience.py — LLM Call 2
      refines the weaker branches.
    allowed_values:
      - Effort Checkpoint
      - Re-engagement Point
      - Progress Anchor
      - Trust Builder

  flow_reusability:
    description: "Standardization and reuse potential"
    purpose: "Benchmarkable / reusable / one-off."
    feeds: [S1, S2, S3]
    strategy: llm-refined
    explanation: >-
      Whether this is a standard instrument you could benchmark against, a reusable
      template, or something written for this survey alone. Feeds question-library
      curation.
    derivation: >-
      Scale-fingerprint match against a benchmark table (NPS 0-10, CSAT 1-5, CES,
      Likert-7) -> Benchmark Question; icon-scale option words or a segmentation
      choice question -> Custom / One-off; a demographic -> Template Question; else
      Custom / One-off. Stage 5, taggers/question/flow_reusability.py — LLM Call 2
      refines the weaker branches and is the only source of Candidate for Library.
    allowed_values:
      - Template Question
      - Benchmark Question
      - "Custom / One-off"
      - Candidate for Library

  apply_method:
    description: "How the tag was assigned"
    purpose: "System- vs user-applied provenance. Constant today."
    feeds: [None]
    strategy: placeholder
    explanation: >-
      Whether the tags on this question were applied by the system or set by a
      person. Provenance for audit, not analysis.
    derivation: >-
      Constant — everything this pipeline writes is System-applied, so the tagger
      returns that unconditionally (Stage 3, taggers/question/apply_method.py).
      User-applied is reserved for a manual-override pathway that does not exist yet.
    allowed_values:
      - System-applied
      - User-applied

  # --- V2 Additions (question-level) ---

  metric_type:
    description: "Classification of the question's measurement type"
    purpose: "What kind of measurement it is."
    feeds: [Pipeline, S3, S5]
    strategy: deterministic
    explanation: >-
      What kind of measurement the question is: a standard metric the platform knows
      how to score, a tenant-defined custom metric, open text, or a plain category.
      calculation_type, stat_test_eligible, trend_trackable and visualization_type
      all read it.
    derivation: >-
      Cascade over platform signals: rs_type 2/3/4 -> Standard Metric; the
      is_custom_metric flag, a grid type or a weighted rating scale -> Custom Metric;
      a text question -> Open-ended; choice types -> Categorical; a contact block ->
      Not Applicable. Stage 3, taggers/question/metric_type.py. Never LLM-refined.
    allowed_values:
      - Standard Metric
      - Custom Metric
      - Open-ended
      - Categorical
      - Not Applicable

  metric_name:
    description: "Named metric this question measures"
    purpose: "The name of the measure - what a chart title says."
    feeds: [Pipeline, S1, S3, S5]
    strategy: hybrid
    explanation: >-
      The name of the thing being measured — NPS, CSAT, CES, eNPS, or a short label
      derived from the question itself for a custom metric. What a chart title would
      say.
    derivation: >-
      Deterministic for platform metrics: rs_type 2 -> eNPS on EX projects else NPS,
      3 -> CES, 4 -> CSAT. Otherwise a cleaned short title for custom metrics and
      matrix rows, Text Feedback for open text, and a fingerprint check that
      recognizes generic satisfaction scales. Skipped when the question measures
      nothing. user_defined, so values outside the listed ones are expected. Stage 3,
      taggers/question/metric_name.py.
    allowed_values:
      - NPS
      - CSAT
      - CES
      - eNPS
      - Engagement Score
      - Retention Intent
      - Overall Satisfaction
      - Text Feedback
    user_defined: true

  calculation_type:
    description: "How responses should be aggregated"
    purpose: "How to aggregate the answers."
    feeds: [Reporting, S3, S5]
    strategy: deterministic
    explanation: >-
      How answers should be rolled into a single number, in vendor-neutral terms.
      Reporting reads this to know whether to average, count, take a percentage, or run
      the NPS formula. `platform_metric` says the same thing in the platform's own
      enum; this one is deliberately the coarser statement, because Reporting and S5
      have no business knowing RMX codes.
    derivation: >-
      A COARSENING of platform_metric, not a second opinion: the derivation lives once
      in taggers/_platform_metrics.py and both dimensions call it, so they cannot
      disagree by construction. Take the primary (first) platform metric and fold it —
      NPS -> NPS Score; CSAT/CES/Custom Metric/Weighted Score -> Weighted Score; Group
      Percentage/Group Count -> Distribution; the seven numeric metrics -> Sum or Mean;
      Overall Rank -> Mean Rank; Percentage and Count pass through. Two answer shapes
      need a coarser word than their primary metric supplies and are named explicitly:
      a Ranking question reads Mean Rank (what a report says about it) even though its
      platform target is Weighted Score on graphs and Overall Rank on tables, and a
      choice list with three or more options reads Distribution rather than Percentage,
      because no single percentage represents it. An empty metric list -> Not
      Applicable. Stage 4, taggers/question/calculation_type.py. Never LLM-refined.
      V8 fixed three things here. The platform's own calculationType hint no longer
      normalizes "weighted" to Mean — the author configured a weighted calculation and
      we were discarding it, while the platform's own default for that question is
      Weighted Score. CSAT and CES stop resolving to Mean, since the platform has
      dedicated metrics for both and defaults to them. And "Top Box %" was dropped: no
      branch ever emitted it and no platform metric implements it — Percent Favorable
      is the real concept it was reaching for.
    allowed_values:
      - Mean                 # RMX 15
      - Percentage           # RMX 09
      - Count                # RMX 08
      - Sum                  # RMX 20 — gated on Phase 0 (Numeric-Open) or an author hint
      - NPS Score            # RMX 01
      - Distribution         # RMX 11 (Group Percentage) / 12 (Group Count)
      - "Mean Rank"          # RMX 22 on tables, 06 on graphs — see platform_metric
      - "Weighted Score"     # RMX 06 — the platform default for grids and rating scales
      - "Percent Favorable"  # RMX 07 — needs favorable_options on non-rs_type questions
      - "Net Intent"         # RMX 05
      - "Not Applicable"

  platform_metric:
    description: "Ordered list of platform metric codes valid for this question, primary first. Maps one-to-one onto the widget payload's metricDetails[] array, where position becomes orderId. Deterministic from response_format + rs_type + option weights."
    purpose: "The metricType a widget insert requires, and the order its rows render in."
    feeds: [S3]
    strategy: deterministic
    explanation: >-
      Which of the platform's twenty metrics this question can actually carry, ordered
      with the primary first. `metricType` is required on every widget insert and
      nothing in the taxonomy could produce one before V8. Position is meaningful: it
      becomes `orderId` in the payload's metricDetails[] array, so a table on an NPS
      question emits NPS then Group Percentage and gets both rows, exactly as the manual
      UI does, while a chart takes the head of the list. `calculation_type` says the
      same thing one level coarser, for consumers that should not know vendor codes.
    derivation: >-
      A port of the platform's compute_metric_types / get_default_metrics_for_question,
      keyed on response_format. The author's own calculationType setting leads when
      present; then the rs_type-specific metric and its band split (NPS/CES/CSAT/Custom
      Metric, each followed by Group Percentage and Group Count); then the four advanced
      metrics for any weighted shape outside the exclusion set (Weighted Score, Weighted
      Score as Percentage, Percent Favorable, Net Intent); then Percentage and Count for
      everything. Date questions get Count and nothing else. Ranking gets Weighted Score
      on graphs plus Percentage, Count and Overall Rank on tables. Numeric-Open gets the
      seven numeric metrics, Sum first. Prose, identifiers and attachments get an empty
      list — a real finding, not a skip. Stage 4,
      taggers/question/platform_metric.py over taggers/_platform_metrics.py.
      Deterministic, never LLM-refined.
      Caveat worth knowing before a payload is posted: this is a port of the platform
      behaviour as DESCRIBED in docs/taxonomy-v8-migration.md, not a transcription of
      the Angular source, and eight of the twenty numeric codes are filled in by
      position rather than quoted. The metric NAMES are the tag values and are safe; the
      codes in _platform_metrics.py should be confirmed against the source.
    multi_label: true
    allowed_values:
      - NPS                          # 01
      - CSAT                         # 02
      - CES                          # 03
      - Custom Metric                # 04
      - Net Intent                   # 05
      - Weighted Score               # 06 — the platform default for grids and ratings
      - Percent Favorable            # 07
      - Count                        # 08
      - Percentage                   # 09
      - Weighted Score as Percentage # 10
      - Group Percentage             # 11
      - Group Count                  # 12
      - Mean                         # 15
      - Mode                         # 16
      - Median                       # 17
      - Min                          # 18
      - Max                          # 19
      - Sum                          # 20
      - Std Dev                      # 21
      - Overall Rank                 # 22

  favorable_options:
    description: "Which answer option ids count as favorable, unfavorable and neutral. Fills metricDetails[].positiveAnswerOptionIds and its negative/neutral siblings. Shape {positive: [], negative: [], neutral: []}; status=skipped when the question has no options or no direction."
    purpose: "Makes Percent Favorable and Net Intent buildable on questions the platform does not score."
    feeds: [S3]
    strategy: hybrid
    explanation: >-
      Which of a question's answer options count as favorable, which as unfavorable and
      which as neither. Without it, Percent Favorable and Net Intent are unbuildable on
      every question that is not rs_type 2, 3 or 4 — which is most of the weighted
      scales in a real survey. This is the first dimension in the taxonomy to say
      anything about ANSWER OPTIONS; everything else stops at the question.
    derivation: >-
      Three tiers. An NPS item (rs_type 2) uses the fixed bands — 9-10 promoters, 7-8
      passives, 0-6 detractors — which are part of the metric's definition rather than a
      reading of this survey. A weighted scale splits at the midpoint of its weight
      range: above is positive, below negative, exactly the midpoint neutral, and an
      unweighted option inside a weighted scale ("Not applicable") is treated as
      neutral rather than counted either way. An UNWEIGHTED scale goes to LLM Call 2,
      which reads the option text — the one case a rule genuinely cannot decide, since
      an unweighted list carries no direction at all. Checkbox lists, routing questions
      and plain category sets are skipped: their options are alternatives, not points on
      a good-to-bad scale. Stage 3, taggers/question/favorable_options.py.
      Known limitation, recorded rather than guessed at: a reverse-coded weighted scale
      (a CES where 1 means "very easy") comes out inverted, because the weights say
      which end is HIGH and nothing in the payload says which end is GOOD. The weight
      tier is held at 0.90 for that reason and the weight range is in the evidence, so a
      reviewer can spot them.
    allowed_values: []
    user_defined: true

  is_filterable:
    description: "Whether this question can serve as a filter/facet in reporting UI"
    purpose: "Drives the dashboard filter bar. Yes for choice lists AND scales."
    feeds: [Reporting, S3, S5]
    strategy: deterministic
    explanation: >-
      Whether the reporting UI can offer this question as a filter. A structural
      capability, not a recommendation — the dashboard service still checks whether
      the data makes it worth showing. Two shapes qualify: a bounded list of
      choices, and a bounded scale (a metric) — "Promoters only" is a filter.
    derivation: >-
      Yes for anything whose answer falls in a bounded, discrete set. Metrics and
      scales are checked first, because the platform's flags outrank the question
      type: rs_type 2/3/4 (NPS/CES/CSAT) or the is_custom_metric flag -> Yes at 1.0;
      a rating/ranking type (RS/RT/RW/RK) or a grid row (GR/GC/RG/GQ) -> Yes at 0.90
      (inferred from the type, and weights are NOT required — an unweighted 1-5 scale
      still has five discrete answers). Then the choice-type whitelist L, R, C, HR,
      ML, SR -> Yes. Free text, contact/signature and unrecognized types -> No.
      Stage 3, taggers/question/is_filterable.py; the scale predicate is shared with
      the dashboard-capability layer via taggers/_metric_utils.py so the two cannot
      resolve it differently. Since V7.3 this is the only statement of the
      capability — control_role, which restated it, was removed. Note free text is
      No here and still searchable: text search reads response_format ==
      "Open-Text". Never LLM-refined.
      V8 re-verified this against the three response formats the Phase 1 split added
      and moved no rule. All three read No, and all three are right to: a Date gets a
      RANGE control rather than a facet (read response_format == "Date", which
      derived_controls now routes to date_filter), a Numeric-Open answer is a real scale
      but an unbounded one with no discrete answer set to facet on, and a File-Upload
      has no answer at all. The Numeric-Open call was made explicitly rather than
      inherited from a fall-through — see the invariant note in
      taggers/_metric_utils.py, which binds this dimension and crosstab_axis_role
      together so they cannot state opposite things about one question.
    allowed_values:
      - "Yes"
      - "No"

  is_segmentable:
    description: "Whether responses can be used to segment/cross-tab other data"
    purpose: "Whether it can break down other questions - incl. a platform metric's bands."
    feeds: [Pipeline, S3, S5]
    strategy: deterministic
    explanation: >-
      Whether this question's answers can be used to break down other questions —
      "NPS by region" needs region to be segmentable. A platform metric's own bands
      count: "everything else by NPS band" is the same comparison seen from the
      other side.
    derivation: >-
      From role_intent and structure: a Segmentation or Profiling / Demographic role
      -> Yes; a hidden-routing question -> Yes; a PLATFORM-scored metric (rs_type
      2/3/4 or the is_custom_metric flag) -> Yes at 0.90, since the platform supplies
      the bands to group by; an unweighted choice question (L/R/C/SR/ML) with between
      2 and 15 options -> Yes; otherwise No. A rating scale the platform has not
      flagged is deliberately filterable without being segmentable — scale points
      make a facet, but there is no agreed banding to group other questions by.
      Stage 4, taggers/question/is_segmentable.py. Gates segment_dimensions. Since
      V7.3 this is the only statement of the capability: control_role's
      Segment-Control was removed rather than kept in sync, because being derived at
      Stage 3 it could not read role_intent and so disagreed with this dimension
      wherever role_intent decides. Never LLM-refined.
      V8 re-verified this against the three response formats the Phase 1 split added
      and moved no rule: Date, Numeric-Open and File-Upload are all `T` questions, which
      is not a bucketing type and cannot carry an rs_type, so all three read No. Nothing
      to group other answers by — a date is continuous, a number is unbounded, an
      attachment is not an answer. Since V8 this dimension also gates
      preferred_segments, which asks the reciprocal question ("which segmenting question
      is worth cutting THIS metric by?"); that is a one-way cascade, not a restatement.
    allowed_values:
      - "Yes"
      - "No"

  stat_test_eligible:
    description: "Whether statistical tests can be applied to responses"
    purpose: "Whether significance testing is meaningful, and which family."
    feeds: [Reporting, S3, S5]
    strategy: deterministic
    explanation: >-
      Whether significance testing is meaningful on this question, and which family
      of test applies. Stops the reporting layer from putting a t-test on a free-text
      box.
    derivation: >-
      From metric_type, option weights and option count: open-ended -> No; a weighted
      metric with at least two options -> Yes - Parametric; a categorical question ->
      Yes - Chi-square; an unweighted metric -> Yes - Non-parametric; otherwise No.
      Stage 4, taggers/question/stat_test_eligible.py. Never LLM-refined.
    allowed_values:
      - "Yes - Parametric"
      - "Yes - Non-parametric"
      - "Yes - Chi-square"
      - "No"

  trend_trackable:
    description: "Whether this question should be tracked over time"
    purpose: "Whether it is worth plotting across waves."
    feeds: [Pipeline, S3, S6]
    strategy: deterministic
    explanation: >-
      Whether the question is worth plotting across waves. Metrics trend; "which
      department are you in" does not.
    derivation: >-
      From metric_type and role_intent: a Standard Metric -> Yes; a Primary Metric or
      Benchmarkable role -> Yes; open-ended -> No; segmentation, demographic or
      screener roles -> No; a driver on a metric scale -> Yes; otherwise No. Stage 4,
      taggers/question/trend_trackable.py. Never LLM-refined.
      Since V8 this is the eligibility GATE that trend_granularity reads — whether, to
      its how often. A one-way cascade: this dimension never reads back.
    allowed_values:
      - "Yes"
      - "No"

  trend_granularity:
    description: "How often to bucket a trend widget for this question, feeding TrendSetting.FrequencyType. Gated on trend_trackable; Not Trendable when the gate says No or the survey ran once."
    purpose: "How often the trend is read — the other half of what a trend widget needs."
    feeds: [S3]
    strategy: hybrid
    explanation: >-
      How often to bucket a trend widget for this question. `trend_trackable` answers
      whether the question belongs on a trend at all; this answers how often to read it,
      and the widget payload needs both. The frequency is really a property of the
      project — its cadence and the span its responses cover — so every trendable
      question in a survey gets the same answer; it is tagged per question because that
      is where a widget is built from.
    derivation: >-
      Gated on trend_trackable == "Yes"; anything else is Not Trendable, which is a real
      value rather than a skip so a composer reading this dimension alone still gets a
      usable answer. A One-time survey is Not Trendable whatever its questions support —
      one wave has nothing to compare against. Otherwise the survey's own cadence picks
      a starting frequency (Always-on -> Weekly, Recurring and Ad-hoc -> Monthly) and
      the response span corrects it in both directions: coarser while the period count
      would breach the platform's hard 100-period cap, which validate_trend_frequency
      rejects outright, so a project spanning three years cannot be Weekly; finer while
      it would plot fewer than three points, which is a trend line in name only. With no
      response span at all the cadence preference stands alone at 0.55 and is NOT
      checked against the cap, which the evidence says out loud. Stage 4,
      taggers/question/trend_trackable.py (same module as the gate, so the registry runs
      them in order).
    allowed_values:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Yearly
      - "Not Trendable"

  segment_dimensions:
    description: "Specific dimensions this question can segment data by. Each entry is {label, question_id} — the label a human reads and the id a widget payload needs."
    purpose: "WHICH respondent attributes it slices by, comparably across surveys."
    feeds: [S3, S5]
    strategy: hybrid
    explanation: >-
      Which respondent attributes this question actually slices by — department,
      region, age, tenure, plan tier — or, for a platform metric, its own score band.
      Where is_segmentable says whether, this says what.
    derivation: >-
      Only runs when is_segmentable is Yes; otherwise an empty list. A platform
      metric returns its band ("NPS Band" / "CES Band" / "CSAT Band", or
      "<custom metric title> Band") and stops there — its title describes what is
      measured, not an attribute of the respondent. Everything else goes through 21
      title regexes (department, region, age, gender, role, tenure, product,
      plan/tier, grade, ...) plus 17 answer-option keywords, unioned into a list;
      segmentable but nothing matched -> an empty list at lower confidence.
      Multi-label and user_defined, so labels are not enum-checked. Stage 4,
      taggers/question/segment_dimensions.py.
      V8 changed the SHAPE, not the labels. Entries used to be bare strings ("Region",
      "Department"), so a dashboard composer had to resolve the label back to a question
      id for every widget it segmented. Each entry now carries both —
      {"label": "Region", "question_id": 4471} — and the round-trip disappears. No new
      dimension was added for the id: that would restate what this one already says and
      leave two fields to keep in agreement, which is exactly why control_role was
      removed in V7.3.
    multi_label: true
    allowed_values: []
    user_defined: true

  journey_stage:
    description: "Customer/employee lifecycle stage this question maps to (industry-dependent enum). Tagged ONLY for journey-eligible metric questions: NPS/CSAT/CES (rs_type 2/3/4) or platform-flagged custom metric (is_custom_metric=True). All other questions get status=skipped."
    purpose: "The tenant journey stage a metric belongs to."
    feeds: [Pipeline, Reporting, S2, S4]
    strategy: llm-only
    explanation: >-
      Which stage of this tenant's own customer or employee journey the metric
      belongs to. The tag that lets scores from different surveys line up on one
      journey view. Metric questions only — every other question is skipped, not
      guessed.
    derivation: >-
      The tagger contributes only the eligibility gate (rs_type 2/3/4 or the
      is_custom_metric flag) and writes pending_llm. The value comes from LLM Call 2,
      choosing from the tenant's profile-derived journey (CX journeys, or the EX
      lifecycle for EX surveys), which is inlined into the prompt in full — every
      moment the tenant has, in profile source order, unranked. The model returns a
      leaf_id and both journey_stage and sub_stage_name are resolved from it, so no
      value is ever model-authored text. An answer outside the journey is dropped
      and the dimension closed as a decline; V9 removed the old snap-to-nearest,
      which only made sense while an embedding ranker supplied an independent
      "belongs somewhere" signal. Stage 5, taggers/question/journey_stage.py with
      llm/profile_journey.py. With SKIP_LLM, no tenant profile, or an LLM failure,
      the dimension is skipped with evidence naming which of the three applied.
    allowed_values: []
    user_defined: true

  sub_stage_name:
    description: "LLM-derived semantic sub-stage label for this metric question's journey tag (2-5 word Title Case, e.g. 'Overall Satisfaction', 'Checkout Ease'). Tagged ONLY for journey-eligible metric questions; status=skipped otherwise. Clustered into canonical per-stage sub-stages at the tenant level."
    purpose: "The readable label inside that stage."
    feeds: [Reporting, S4]
    strategy: llm-only
    explanation: >-
      A short business-language label for what exactly the metric measures inside its
      journey stage — "Checkout Ease" within Purchase. The readable half of the
      journey tag. Metric questions only.
    derivation: >-
      Same eligibility gate as journey_stage, and assigned atomically with it by LLM
      Call 2 as a 2-5 word Title Case phrase. A missing or malformed label is
      synthesized as "Other {stage}" rather than left blank. Stage 5,
      taggers/question/sub_stage_name.py.
    allowed_values: []
    user_defined: true

  visualization_type:
    description: "Recommended chart type for this question's data"
    purpose: "The single default chart pick."
    feeds: [Reporting, S3]
    strategy: llm-refined
    explanation: >-
      The single recommended chart for this question — the default pick.
      widget_compatibility holds the full set of charts that would be valid; this is
      the one to use absent a better reason.
    derivation: >-
      Rule table over response_format, metric_type, role_intent and option count:
      Date -> Line Chart; Numeric-Open -> Number; File-Upload and Contact -> Table;
      Open-Text -> Word Cloud; a primary standard metric -> Number; a matrix row ->
      Horizontal Stacked Bar; categorical -> Pie Chart for two options else Horizontal
      Bar; other metrics -> Horizontal Bar; fallback Table. Stage 5,
      taggers/question/visualization_type.py — LLM Call 2 refines the low-confidence
      defaults, and is the only source of Gauge and Scatter Plot.
      V8 applied the same renames and deletions as widget_compatibility, so the two
      speak one chart language and a composer never translates between them — but added
      nothing new. A default should stay conservative; the exotic charts belong in the
      allow-list, where the dashboard service can reach for one deliberately. The rule
      table also branches on response_format FIRST now: it used to key off metric_type,
      where every text question reads Open-ended, so a date picker, a numeric field and
      a file upload all defaulted to a word cloud.
    allowed_values:
      - Number                    # was "Score Card"
      - Gauge
      - Horizontal Bar            # the platform default orientation
      - Vertical Bar
      - Horizontal Stacked Bar    # the only legal default for a matrix row
      - Line Chart
      - Pie Chart
      - Table
      - Word Cloud
      - Scatter Plot

  dashboard_placement:
    description: "Which dashboards this question should appear on (multi-label)"
    purpose: "Which dashboards this question surfaces on."
    feeds: [S3]
    strategy: llm-refined
    explanation: >-
      Which dashboards this specific question should surface on, inside the set the
      survey is already routed to by dashboard_routing.
    derivation: >-
      Rules that may only pick names already present in the project's
      dashboard_routing: a standard primary metric -> Executive Dashboard;
      open-ended -> Voice of Customer/Employee; a driver -> the Customer
      Experience/Employee Engagement dashboard; nothing chosen -> the first routed
      dashboard. Written at a flat, deliberately low confidence so LLM Call 2's names
      union-merge on top. Multi-label and user_defined, so LLM names are not
      enum-checked. Stage 5, taggers/question/dashboard_placement.py.
    multi_label: true
    allowed_values: []
    user_defined: true

  display_role:
    description: "How this question should be displayed on dashboards"
    purpose: "How prominent it is once on a dashboard."
    feeds: [S3]
    strategy: llm-refined
    explanation: >-
      How prominent the question should be once it is on a dashboard — the headline
      KPI, a supporting metric, or something you only see after drilling in.
    derivation: >-
      Mapped from role_intent, metric_type and trend_trackable: a primary standard
      metric -> Primary KPI; Benchmarkable -> Comparison Metric; a driver ->
      Supporting Metric; a verbatim -> Detail View; a diagnostic -> Drill-down; a
      trend-trackable question -> Trend Indicator; fallback Detail View. Stage 5,
      taggers/question/display_role.py — LLM Call 2 refines the weak defaults.
      V8 left every value alone. It gained a consumer instead: widget_footprint reads
      this to decide how much grid space the widget takes, so if a footprint looks
      wrong, the thing to fix is the role.
    allowed_values:
      - Primary KPI
      - Supporting Metric
      - Detail View
      - Drill-down
      - Comparison Metric
      - Trend Indicator

  widget_footprint:
    description: "How much dashboard grid space the widget should occupy, feeding cols and rows on the widget payload. The grid is 24 columns wide. Deterministic from display_role + block_id."
    purpose: "The widget's size, so a composer can batch the geometry correction."
    feeds: [S3]
    strategy: deterministic
    explanation: >-
      How much of the dashboard grid this question's widget should take. Every widget
      ships 12x6 today, so any other size costs a second API round-trip per widget —
      the fixed-geometry limitation recorded in
      docs/custom-dashboard-end-to-end-flow.md section 11. Stating the intended
      footprint in the tag is what lets a composer batch that correction, or skip it
      where 12x6 is already right.
    derivation: >-
      A matrix block wins first: a question carrying a block_id is rendered as part of
      one widget covering every row, and a stacked bar with that many sentence-length
      labels needs the full width. Otherwise mapped from display_role — Primary KPI ->
      Quarter, so four score tiles sit in one row across the top of the dashboard, which
      is how a KPI band is meant to read; everything else -> Half, which puts two side
      by side and is also the size the platform already ships, so those widgets cost no
      correction at all. No display_role -> Half at 0.60, for the same reason: it is the
      one choice that is never wrong enough to need a second API call. Stage 5,
      taggers/question/widget_footprint.py. Deterministic, no LLM cost.
      "Tall (12x12)" is declared and deliberately never emitted. Nothing in the taxonomy
      says a widget needs vertical room rather than horizontal — that follows from how
      many rows the DATA has, which the dashboard service learns when it checks
      viability and this tagger never sees. A composer that has counted the rows may
      still choose it.
    allowed_values:
      - "Quarter (6x6)"
      - "Half (12x6)"
      - "Full-Width (24x6)"
      - "Tall (12x12)"

  preferred_segments:
    description: "For a metric question, the 1-3 segmenting question_ids worth cutting THIS metric by, most relevant first. Feeds segmentType and segmentationQuestion on the widget payload. status=skipped for non-metric questions."
    purpose: "Which cut of this metric is worth showing — the missing half of segmentation."
    feeds: [S3, S5]
    strategy: llm-refined
    explanation: >-
      For a metric question, which one to three segmenting questions are worth cutting
      it by. Segmentation was one-sided before V8: is_segmentable and segment_dimensions
      say a question CAN segment, and nothing said which cut was worth making for a
      given metric. This is the same reciprocal-pointer pattern as driver_link and
      verbatim_link, applied to the one pairing that was left out.
    derivation: >-
      The tagger contributes the eligibility gate and the candidate list; the ranking is
      LLM Call 2's. Non-metric questions are skipped — segmenting one grouping by
      another is a cross-tab, which is the other side of this pairing. A metric with no
      segmentable question anywhere in the survey returns an empty list at 1.0, and that
      empty list is the finding: the survey collects a number and nothing to explain it
      with. Otherwise the candidates are every question the survey tagged
      is_segmentable == "Yes", and the tag is left pending_llm. That split is
      deliberate rather than an economy — which candidates EXIST is a structural fact,
      and "NPS by region" versus "NPS by plan tier" is a question about the business,
      not about the schema, so no rule here guesses at it. Stage 5,
      taggers/question/preferred_segments.py.
    multi_label: true
    allowed_values: []
    user_defined: true

  display_label:
    description: "A 2-6 word chart title for any chart-eligible question, feeding `title` on the widget payload. Length-capped free text; status=skipped when widget_compatibility is empty."
    purpose: "What the chart is called, when no metric name covers it."
    feeds: [Reporting, S3]
    strategy: llm-refined
    explanation: >-
      A short chart title for any question a widget can render. metric_name covers only
      measured questions and sub_stage_name only journey-eligible metrics, so a plain
      segmentation question's widget currently gets the raw question text — often a full
      sentence — as its title.
    derivation: >-
      Skipped when widget_compatibility is empty: no chart, no title. When metric_name
      exists it IS the label, written ABOVE the LLM override threshold on purpose — not
      as an economy, but because the two would otherwise be free to disagree, and a
      dashboard showing "Overall Satisfaction" in the tag and "How happy were you?" on
      the chart is worse than either alone. Only when no metric name exists does LLM
      Call 2 write a 2-6 word Title Case phrase from the question text, seeded by a
      cleaned truncation of the title (numbering and the interrogative opening stripped)
      held at 0.45 so the model always wins — and left in place as an honest fallback
      when the call does not land. user_defined, so the value is never enum-checked,
      only trimmed and length-capped. Stage 5, taggers/question/display_label.py.
    allowed_values: []
    user_defined: true

  # --- V7 Additions (question-level): Dashboard Capability Layer ---
  # Intrinsic, per-question facts consumed by the downstream (LLM-driven)
  # dashboard-composition service. This layer states what each question is
  # CAPABLE of (which charts can render it, whether it can act as a filter or
  # segment, how it can be cross-tabbed). It does NOT decide the dashboard —
  # the dashboard service confirms data VIABILITY (response volume, null rate,
  # distinct-value count) and does the contextual selection/pairing/layout.
  # All five derive deterministically from rs_type + question_type +
  # question_sub_type + answer option weights (Stage 3, no LLM cost).
  # V8 added question_sub_type to that input list, which is what split
  # response_format's Open-Text into four distinct shapes.

  response_format:
    description: "Canonical answer shape of the question. The anchor field the rest of the capability layer derives from. Deterministic from rs_type + question_type + option weights."
    purpose: "Canonical answer shape - the capability-layer anchor."
    feeds: [Pipeline, S3]
    strategy: deterministic
    explanation: >-
      The canonical shape of the answer, independent of how the question is worded.
      The anchor fact the whole capability layer cascades off — if this is wrong, the
      five dimensions below inherit the error.
    derivation: >-
      The platform's metric flag wins over the question type, because the same widget
      is used for scored and unscored questions: rs_type 2 -> NPS-Scale, 3 ->
      Effort-Scale, 4 -> Rating-Scale. For a text question the SUB-type then wins over
      the bare T: sub-type 1 -> Date, 31 -> Contact (an email field has a contact
      block's capability exactly), 71 -> File-Upload, the statistical sub-type ->
      Numeric-Open, anything else -> Open-Text. Otherwise the question type maps to its
      shape — CS -> Contact, RK -> Ranking, RS/RT/RW -> Rating-Scale, grid types ->
      Matrix-Row, HR -> Hidden-Select, select types -> Multi-Select or Single-Select by
      the is_multi flag. Stage 3, taggers/question/dashboard_capability.py, with the
      sub-type codes named once in taggers/_sub_types.py so this and role_intent and
      data_sensitivity cannot drift. Never LLM-refined.
      V8 NOTE — Numeric-Open is declared but currently unreachable: our
      numeric/statistical sub-type code has not been enumerated from live payloads and
      is not guessed at. See the Phase 0 note in this file's header.
    allowed_values:
      - NPS-Scale           # rs_type=2
      - Rating-Scale        # rs_type=4 (CSAT); weighted RS/RT/RW
      - Effort-Scale        # rs_type=3 (CES)
      - Ranking             # RK
      - Single-Select       # L / R / SR (unweighted)
      - Multi-Select        # C / ML
      - Hidden-Select       # HR (routing question)
      - Matrix-Row          # GR / GC / RG / GQ
      - Open-Text           # T, genuine free prose only
      - Contact             # CS (contact / signature), and T sub-type 31 (email)
      - Date                # T, date sub-type — Count metric only; drives the date filter
      - Numeric-Open        # T, statistical sub-type — the only true Ratio scale (Phase 0)
      - File-Upload         # T sub-type 71 — no analyzable answer at all
      - Not Applicable

  scale_of_measurement:
    description: "Statistical level of measurement. Independently gates valid chart types AND stat_test_eligible. Nominal=categories, Ordinal=ranked, Interval=equal-spacing (e.g. NPS 0-10), Ratio=true zero."
    purpose: "Which maths the answers legitimately support."
    feeds: [Pipeline, S3]
    strategy: deterministic
    explanation: >-
      What maths the answers legitimately support. Nominal answers can only be
      counted, ordinal ones ranked, interval ones averaged — this is what decides
      which statistics a widget may show.
    derivation: >-
      Read off response_format: NPS-Scale and Date -> Interval; Rating-Scale,
      Effort-Scale and Ranking -> Ordinal; the select formats -> Nominal; Matrix-Row ->
      Ordinal when its options carry weights, else Nominal; Numeric-Open -> Ratio;
      Open-Text -> Unstructured; Contact and File-Upload -> N/A. Stage 3,
      taggers/question/dashboard_capability.py. Never LLM-refined.
      V8 changed no value here, only the routing. Date joins NPS on Interval — ordered
      with meaningful intervals, no true zero — and Numeric-Open becomes Ratio's first
      and only source. Ratio was emitted by nothing in taggers/ before the Phase 1
      split and was a candidate for deletion; it stays because it now has a rule, and
      the eval run that confirms the rule fires is what makes that final.
    allowed_values:
      - Nominal
      - Ordinal
      - Interval            # NPS-Scale, Date
      - Ratio               # Numeric-Open only (gated on Phase 0)
      - Unstructured        # free text
      - N/A

  cardinality_class:
    description: "Shape of the value space; gatekeeps pie-vs-bar-vs-histogram-vs-wordcloud. Derived from option_count and response_format."
    purpose: "Size of the value space; the chart-readability gate."
    feeds: [Pipeline, S3]
    strategy: deterministic
    explanation: >-
      How large the value space is. The practical question it answers is whether a
      chart stays readable — a pie chart of 40 slices is valid and useless.
    derivation: >-
      From response_format first: scales, matrix rows and the two new numeric shapes
      (Date, Numeric-Open) roll up to a score or a measurement, so -> Continuous;
      Open-Text -> Free-Text; Contact, File-Upload and unrecognized -> N/A. Otherwise
      banded on option_count: 2 -> Binary, 3-7 -> Low, 8 or more -> High. Stage 3,
      taggers/question/dashboard_capability.py. Never LLM-refined.
      All six values keep their meaning in V8; only the routing changed. Worth
      exporting option_count alongside this — the dashboard service currently re-fetches
      /QuestionDetail to learn what we already knew.
    allowed_values:
      - Binary              # 2 options
      - Low                 # 3-7 options
      - High                # 8+ discrete options
      - Continuous          # numeric / scale
      - Free-Text
      - N/A

  verbatim_enrichment:
    description: "Text-analytics outputs that exist for this open-text question's answers (sentiment, themes, emotions, topics, action plans)."
    purpose: "Which NLP widgets have something to render for this question."
    feeds: [Reporting, S3]
    strategy: deterministic
    explanation: >-
      What the platform's text analytics already produced for this question's
      verbatims. An open-text question with scored sentiment and extracted themes can
      support a theme or sentiment widget; one whose answers were never analyzed
      cannot, however identical the two look in the survey structure.
    derivation: >-
      Read per question from survey_response_data.parquet, keyed by
      FeedbackQuestionId: presence of Sentiment, SentimentScore, Themes, Emotions,
      Topics and ActionPlan across the question's verbatim rows. Counts and the most
      frequent label names go on the evidence; the answers themselves are never read
      into the artifact. Confidence drops to 0.70 when under 25% of the question's
      rows are enriched. Skipped for questions that collect no free text, and for
      open-text questions whose verbatims have not been analyzed. Stage 3,
      taggers/question/verbatim_enrichment.py. Never LLM-refined.
    multi_label: true
    allowed_values:
      - Sentiment
      - Sentiment Score
      - Themes
      - Emotions
      - Topics
      - Action Plans

  widget_compatibility:
    description: "The SET of chart/widget types that can validly render this question. `visualization_type` remains the single DEFAULT pick; this is the full allow-list the dashboard service chooses from. Derived by rule table over response_format + scale_of_measurement + cardinality_class."
    purpose: "Every widget that could validly render it."
    feeds: [S3]
    strategy: deterministic
    explanation: >-
      Every widget that could validly render this question, not just the default one.
      The dashboard-composition service picks from this shortlist; visualization_type
      is the single pick made in advance.
    derivation: >-
      Lookup table keyed by response_format — for example NPS-Scale -> Number, Gauge,
      Horizontal/Vertical Bar, Line Chart, Area, Pie Chart, Donut, Table; Matrix-Row ->
      Horizontal Stacked Bar, Vertical Stacked Bar, Table and NOTHING else; Open-Text ->
      Table alone. Structural validity only: the dashboard service still confirms
      response volume and distinct-value count before using one. Stage 3,
      taggers/question/dashboard_capability.py. Never LLM-refined.
      V8 rebuilt this vocabulary against the platform's own chart codes. Orientation is
      not cosmetic — horizontal and vertical are separate codes — so Bar Chart and
      Stacked Bar Chart each split in two and the composer stops guessing. Score Card
      took the platform's name for the same code, Number. Six real codes we could never
      recommend were added (Donut, Area, Radar, Bubble, and the two clustered bars).
      Four values were dropped for having no code behind them at all (Heat Map,
      Distribution Chart, Sentiment, Map) and two for being something else wearing a
      chart's name — Trend Line is dataDisplayMode=4 plus Line or Area, and its
      information moved to trend_granularity; Ranking Bar is a Horizontal Bar carrying
      a Weighted Score metric, which platform_metric now expresses.
      Three rule-table contradictions were fixed at the same time: a grid may use only
      the two stacked variants, a checkbox question EXCLUDES stacked/pie/donut because
      its answers do not sum to a whole, and an open-text question gets a table alone.
    multi_label: true
    # Which charts need which metric family. The platform's allowed set genuinely
    # flips on the metric — a count/percentage metric unlocks the division charts,
    # a scored metric collapses the set to bars plus gauge and number — so stating
    # the allow-list as if it were metric-independent could not be honest.
    # `widget_compatibility` is the UNION over the question's valid metrics; read it
    # together with `platform_metric` and this block to narrow it for one widget.
    # Documentation only, the same device `crosstab_axis_role` uses for
    # `derived_controls`: no tagger reads it and nothing validates against it.
    metric_constraints:
      count_or_percentage: >-
        Pie Chart, Donut, Horizontal/Vertical Stacked Bar, Bubble and Radar require a
        Count, Percentage, Group Count or Group Percentage metric — they divide a whole,
        and only a count-family metric has a whole to divide.
      scored: >-
        Gauge and Number require a scored metric (NPS, CSAT, CES, Custom Metric,
        Weighted Score, Net Intent, Percent Favorable, or one of the seven numeric
        metrics). There is one number to show.
      any: >-
        Horizontal Bar, Vertical Bar, Line Chart, Area and Table carry any metric.
      needs_a_comparison_axis: >-
        Radar, Bubble and both clustered bars need several attributes or a segment to
        compare, not just several answer options — a radar with one spoke is not a chart
        of anything. They are offered on the select and ranking shapes and withheld from
        a single scored scale question, whose answer is one series.
      trend_only: >-
        Line Chart and Area are the only two charts permitted in trend display mode
        (dataDisplayMode=4). A trend widget must pick one of them.
      checkbox_excluded: >-
        A Multi-Select question excludes Pie Chart, Donut and both stacked bars whatever
        its metric: the responses do not sum to a whole.
      grid_only: >-
        A Matrix-Row question permits only Horizontal Stacked Bar, Vertical Stacked Bar
        and Table. No metric widens that.
    allowed_values:
      - Number                    # 14 — was "Score Card"; the platform's own name
      - Gauge                     # 12
      - Horizontal Bar            # 01
      - Vertical Bar              # 02
      - Horizontal Stacked Bar    # 03
      - Vertical Stacked Bar      # 13
      - Clustered Horizontal Bar  # 16
      - Clustered Vertical Bar    # 17
      - Line Chart                # 09
      - Area                      # 08
      - Pie Chart                 # 04
      - Donut                     # 07
      - Radar                     # 06
      - Bubble                    # 05
      - Scatter Plot              # 11 — reachable only via LLM refinement
      - Word Cloud                # 10 — BLOCKED: needs open-ended widget type 20,
                                  #      which has no creator. Never emitted by the
                                  #      rule table; kept so the block is describable.
      - Table                     # widget type 02, not a chart — the fallback that
                                  #      always works

  # `control_role` was removed in V7.3. It restated is_filterable, is_segmentable
  # and "is this Open-Text" as one multi-label field, so three dimensions had to be
  # held in agreement — and because it is derived at Stage 3 it could not see
  # role_intent, so it disagreed with is_segmentable on exactly the questions where
  # role_intent decides. Two of its five values (Date-Filter, None) were never
  # emitted at all. Read the dashboard controls off the dimensions below instead;
  # `derived_controls` on crosstab_axis_role states the mapping.

  crosstab_axis_role:
    description: "Eligibility as an axis when combining questions in a table / cross-tab widget. Column-Eligible = a measured metric; Row-Eligible = a grouping dimension."
    purpose: "Which cross-tab axis it can occupy."
    feeds: [S3]
    strategy: deterministic
    explanation: >-
      Which axis of a cross-tab the question can occupy: a measure belongs in the
      columns (it is what gets compared), a grouping attribute on the rows (it is
      what does the comparing), and a platform-banded metric can do both.
    derivation: >-
      From response_format plus one flag: metric-shaped formats and matrix rows are
      measures -> Column-Eligible, upgraded to Both when the platform scores the
      metric (rs_type 2/3/4 or is_custom_metric) and therefore supplies bands the
      rest of the survey can be grouped by; the select formats are groupings ->
      Row-Eligible; everything else -> None. A metric you can merely filter on
      stays Column-Eligible — it is still what gets compared — so an unflagged
      rating scale or a grid row reads Column-Eligible while an NPS item reads
      Both. Stage 3, taggers/question/dashboard_capability.py. Never LLM-refined.
      V8 changed nothing here, and the three new response formats all read None. The one
      worth stating out loud is Numeric-Open: it genuinely measures something, and
      Column-Eligible is tempting — but Phase 1 decided explicitly that an unbounded
      numeric answer is not a bounded scale, so is_filterable reads No for it. The
      invariant in taggers/_metric_utils.py is that this dimension and is_filterable
      must not state opposite things about whether an answer lands on a scale, so
      Numeric-Open reads None on both sides rather than measuring on one and not the
      other. Flip both together, or neither. Worth noting that cross-tab widget type 40
      has no creator on the platform today, so nothing here is buildable either way.
    # How a dashboard composer picks its controls now that `control_role` is gone.
    # These are read off dimensions already in the output — no field restates them.
    derived_controls:
      filter_dropdown: 'is_filterable == "Yes"'
      segment_picker:  'is_segmentable == "Yes"'
      text_search:     'response_format == "Open-Text"'
      # V8: derivable for the first time. The Phase 1 split gave date questions
      # their own response format, so a date filter no longer has to be guessed
      # at from the question type. Note this is a RANGE control, which is why
      # is_filterable still reads No for a Date — it builds no facet.
      date_filter:     'response_format == "Date"'
    allowed_values:
      - Row-Eligible
      - Column-Eligible
      - Both
      - None

  # --- V7 Additions (question-level): Cross-Question Relationships ---
  # Surfaced directly from raw platform signals already loaded onto
  # QuestionContext (is_key_driver, metric_question_id / is_followup_question,
  # matrix_group_title / matrix_group_size). These let the dashboard service
  # pair questions: drivers to outcomes, verbatims to parents, matrix rows to
  # one widget. user_defined because values are references/ids, not enums.
  # status=skipped when the relationship does not apply.

  driver_link:
    description: "For key-driver questions (raw is_key_driver=True): marks the question as an explanatory driver to be paired with the outcome metric it explains. Value carries the linked outcome metric question_id when resolvable, else the flag 'Key Driver'. status=skipped for non-drivers. Source: is_key_driver."
    purpose: "Pairs a driver with the outcome metric it explains."
    feeds: [S3, S5]
    strategy: deterministic
    explanation: >-
      Marks a question the platform treats as a key driver and points at the outcome
      metric it explains, so the pair can be rendered as one driver-vs-outcome
      widget instead of two unrelated charts.
    derivation: >-
      Pass-through of the platform's is_key_driver flag. When the platform also names
      the outcome question, that question_id becomes the value; when it does not, the
      literal "Key Driver" marks a driver with no partner to pair with. Non-drivers
      are skipped. Stage 3, taggers/question/relational_links.py. Never LLM-refined.
    allowed_values: []
    user_defined: true

  verbatim_link:
    description: "For follow-up / open-text questions attached to a parent metric (raw is_followup_question + metric_question_id): the parent metric question_id this question elaborates, so its verbatim/detail can be rendered alongside the parent's widget. status=skipped when standalone. Source: metric_question_id."
    purpose: "Pairs a verbatim with its parent metric."
    feeds: [S3, S6]
    strategy: deterministic
    explanation: >-
      The parent metric a follow-up question elaborates. "Why did you give that
      score?" only means something next to the score, and this is the pointer that
      keeps them together.
    derivation: >-
      Pass-through of the platform's metric_question_id on the question; that id
      becomes the value. A question naming no parent is skipped — it stands on its
      own. Stage 3, taggers/question/relational_links.py. Never LLM-refined.
    allowed_values: []
    user_defined: true

  block_id:
    description: "Grouping key for questions that belong to one matrix/grid block (raw matrix_group_title, matrix_group_size > 1), so the dashboard service can render the whole block as a single heat-map/table widget. Value is the matrix group identifier; status=skipped for standalone questions. Source: matrix_group_*."
