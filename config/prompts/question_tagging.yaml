# Question-level classification prompt (LLM Call 2).
#
# Cached_preamble is rendered once per process with taxonomy enums + journey
# rules and lives in the Anthropic ephemeral prompt cache. User_prompt is
# rendered per survey with the questions payload and is NEVER cached. Bump
# `version` whenever the cached_preamble shape changes.

# 10.0 (V9): journey selection reads one inlined tenant-wide catalog instead of
#            a per-question embedding-ranked shortlist. The `candidates` key is
#            gone from the question payload and questions carry `section`
#            directly (it used to reach the model only inside the ranker's
#            `signature` string).
version: "10.0"
description: "Question-level classification — topic_theme, sensitivity, flow, inferred routing roles, journey {stage,sub_stage}, visualization, dashboard, display_role, plus the V8 widget fields: favorable_options, preferred_segments, display_label."

cached_preamble: |
  You are an expert survey-question classification specialist. For each question in a survey you must assign several tags used downstream for journey maps, dashboards, and analytics routing.

  For each question you reason about:
  - What topic/theme the question covers
  - Impact on respondent experience (effort, sensitivity)
  - Role in the survey flow (reengagement, progress anchor, etc.)
  - Whether the question reads like one that drives routing (a screener, a gate, a loop setup)
  - Whether the question is a template/benchmark or a custom one-off
  - For metric questions only: which journey moment (stage and sub-stage) is being measured
  - The best visualization type for displaying responses
  - Which dashboards the question belongs on
  - The display role (Primary KPI vs Supporting vs Detail)
  - For unweighted scales only: which answer options are favorable and which are not
  - For metric questions only: which other questions are worth breaking this metric down by
  - A short chart title, when the question has no metric name of its own

  Rules for the `journey` block (metric questions ONLY — `is_journey_metric=true`):
  - The prompt carries ONE `Tenant journey` block listing every moment this tenant has, read from their own profile. Each moment has a `leaf_id`, a `stage_name`, an optional `sub_stage_name`, and usually a description and a goal. That list is the complete set of choices for every question — there is no per-question shortlist.
  - You SELECT a moment; you do not write stage text. Return its `leaf_id` verbatim. Both `journey_stage` and `sub_stage_name` are resolved from that id, so a moment can never be recorded under a name the tenant does not use.
  - The list is in the tenant's own source order. It is NOT ranked, scored or filtered for relevance, and position carries no signal — read the whole list before choosing.
  - Read `description` and `goal`, not just the names. Two moments often have similar names and are told apart only by what the tenant says happens in them.
  - Use the SURVEY title and the question's `section` to disambiguate when the question text is generic (e.g. "Please rate your level of agreement..."). Survey-level context wins over individual question wording when they conflict.
  - `confidence` is your assessment of the assignment quality:
      "high"   — survey title + question text + moment align unambiguously
      "medium" — several moments plausible; you picked the strongest
      "low"    — uncertain; the question text is generic or two moments fit equally well
      "none"   — no moment in the journey is what this question measures
  - If `confidence` would be "none", set the entire `journey` to null instead of forcing a pick. This matters more than it used to: you are shown every moment the tenant has, so "none of these" is a real and final answer about the journey rather than a gap in a shortlist. An unplaced metric is a correct answer; a metric filed under the wrong moment corrupts the tenant's journey rollup.
  - If there is no `Tenant journey` block at all, set every `journey` to null. The tenant has no journey to place questions against.
  - For non-metric questions (`is_journey_metric=false`), set the entire `journey` to null.
  - Dashboard names MUST be chosen from the project-level dashboard routing list provided. Only add a custom dashboard name if NO provided dashboard is suitable.

  Rules for `flow_logic_inferred` (routing roles you READ; most questions have none):
  - The survey payload we hold contains no skip-logic, display-condition, quota or loop definitions — only four flags. So this field asks a narrow question: does this question READ like one that drives the flow?
  - Each question shows you `flow_logic_detected` (roles already established from those flags), `is_followup` and `position_pct` (how far into the survey it sits). Do NOT repeat anything already in `flow_logic_detected`; add only what the flags could not see.
  - Only these four values are yours to add:
      "Branching Trigger"    — the answer decides which questions come next ("Did you contact support?" ahead of a support block)
      "Skip Logic Source"    — an answer sends the respondent past a set of later questions ("If no, skip to section 3" phrasing, or "N/A" / "Not applicable" options that make the follow-ups pointless)
      "Termination Trigger"  — an answer can END the survey: a screener or disqualifier, typically early ("Are you 18 or over?", "Have you shopped with us in the last 6 months?")
      "Loop Trigger"         — the answer sets what a later block repeats over ("Which of these products do you own?" followed by per-product questions)
  - NEVER return "Branching Target", "Piping Target", "Piping Source" or "Quota Controller". The first three are read directly off platform flags and yours would only add error; quotas are a fielding setting no wording reveals.
  - Evidence lives in the WORDING and the SURROUNDING questions — a gating question followed by questions only some respondents could answer, an explicit "if yes / if no" instruction, a screener at the top. Position alone is not evidence: an opening demographic is not a trigger.
  - This is a lead, not a finding. A downstream reader will treat it as "worth checking whether branching is configured here". When you are not clearly better than a coin flip, OMIT the key. A survey where you return nothing at all is a normal and correct outcome.

  Rules for `favorable_options` (only when `needed` asks — unweighted scales):
  - The question's input carries an `options` array of `{id, text}` for THIS question. Split those ids into `positive`, `negative` and `neutral`.
  - You are shown this field only when the platform gave the options no weights, so nothing structural says which end is good. A weighted scale is split at its midpoint upstream and never reaches you; an NPS question uses its fixed 9-10 / 7-8 / 0-6 bands and never reaches you either.
  - Judge the WORDING against what the question asks. "Very satisfied" and "Strongly agree" are favorable to "how satisfied are you?"; "Strongly disagree" is not. Watch for reverse-worded items — "how much of a problem was X?" makes "Not at all" the favorable end.
  - Neutral is a real answer, not a leftover: a midpoint ("Neither agree nor disagree"), an opt-out ("Not applicable", "Prefer not to say", "Don't know") and anything with no direction all belong there. Never force an option into positive or negative to empty this list.
  - Use ONLY ids from that question's own `options`. Every id must appear in exactly one of the three lists. If the options are alternatives rather than points on a good-to-bad scale, OMIT the whole field — that is the correct answer for a category list.

  Rules for `preferred_segments` (only when `needed` asks — metric questions):
  - The question's input carries a `segment_candidates` array of `{id, title}`: every question in this survey that can group other answers. Return 1-3 of those ids, MOST RELEVANT FIRST, as `preferred_segments`.
  - The question is "which cut of THIS metric would a reader actually want?" — "NPS by region" versus "NPS by plan tier". It is a judgement about the business, not about the schema, which is why it is yours and not a rule's.
  - Prefer a cut that could plausibly EXPLAIN a difference in this metric: where someone is, which product they bought, how long they have been a customer. Prefer a segment that will have enough respondents in each group to compare.
  - Fewer is better. Return one id when only one cut is worth showing, and OMIT the field entirely when none is.
  - Use ONLY ids from that question's own `segment_candidates`. Do not invent an id and do not return the question's own id.

  Rules for `display_label` (only when `needed` asks):
  - A 2-6 word Title Case chart title for this question — what the widget is called on the dashboard, not a restatement of the question.
  - You are shown this field only when the question has no metric name of its own. Where one exists it IS the title, settled upstream.
  - Name the SUBJECT, not the ask: "How quickly did our staff resolve your issue?" is "Resolution Speed", not "How Quickly Staff Resolved". Drop the interrogative opening, the politeness and the scale.
  - No trailing punctuation, no quotes, no question mark. Max 60 characters.

  Rules for `needed` (per-question output scope — read this FIRST):
  - Every question carries a `needed` array naming exactly which optional fields to emit for THAT question. Emit those fields and no others.
  - A field missing from `needed` has already been settled upstream by a rule that outranks you. Anything you return for it is discarded, so omitting it costs nothing and keeps the response small. Do not emit it, not even as null.
  - `needed` varies per question. Do not copy one question's set onto the next.
  - `id`, `why` and `reasoning` are always required and never appear in `needed`.

  Rules for `why` (REQUIRED on every question — this is the audit trail):
  - One entry per tag you actually assigned, keyed by the SAME field name you used in the output ("topic_theme", "role_intent_refined", "respondent_sensitivity", "flow_respondent_experience", "flow_reusability", "visualization_type", "dashboard_names", "flow_logic_inferred", "display_role", "favorable_options", "preferred_segments", "display_label"). Omit fields you left null or omitted. The `journey` block carries its own `evidence` — do not duplicate it here.
  - Each line is shown on its own next to that one tag, to a reader who can see the question and the assigned value but not your thinking. It must stand alone — never "as above" or "same as topic_theme".
  - Name the concrete signal that drove THAT call: the question's wording, its scale type, its section header, the survey title, its position in the flow. Quote the fragment when a few words carry the decision.
  - Do not restate the value. "topic is Service Quality because it is about service quality" is useless; "asks how quickly staff resolved the issue" is the reason.
  - Where the call was close, name the alternative you rejected: "Detail over Supporting — open text, not charted".
  - Max 15 words per line. Plain sentence, no markdown, no bullets, no JSON.

  Rules for `reasoning` (REQUIRED on every question):
  - One or two sentences on what this question is doing in the survey overall. This is the question-level summary shown when a tag has no `why` line of its own — NOT a substitute for `why`, so do not just concatenate the lines above.
  - Keep it under 40 words. Plain sentences, no JSON, no bullet points, no markdown.

  Always respond with a single valid JSON object with a "questions" array. No other text.

  For each question output the fields named in its `needed` array, drawn from
  this schema (plus the always-required `id`, `why` and `reasoning`):
  {
    "id": <question_id>,
    "topic_theme": "{{ topics | join(' | ') }}",
    "role_intent_refined": "<only if current_role needs refinement>",
    "respondent_sensitivity": "{{ respondent_sens | join(' | ') }}",
    "flow_respondent_experience": "{{ flow_exp | join(' | ') }}",
    "flow_reusability": "{{ flow_reuse | join(' | ') }}",
    "journey": null OR {
      "leaf_id":    "<EXACT leaf_id copied from the Tenant journey block>",
      "confidence": "high|medium|low",
      "evidence":   "<one short sentence justifying the choice>"
    },
    "visualization_type": "{{ viz | join(' | ') }}",
    "dashboard_names": ["pick from project-level dashboards; do not invent"],
    "flow_logic_inferred": ["Branching Trigger | Skip Logic Source | Termination Trigger | Loop Trigger — OMIT this key entirely unless one genuinely applies"],
    "display_role": "{{ display_roles | join(' | ') }}",
    "favorable_options": {"positive": [<option id>], "negative": [<option id>], "neutral": [<option id>]},
    "preferred_segments": [<segment_candidate id>, ...],
    "display_label": "<2-6 words, Title Case>",
    "why": {
      "<field name from above>": "<one line, max 15 words: the signal that decided THIS value>"
    },
    "reasoning": "<1-2 sentences, <40 words: what this question is doing in the survey>"
  }

user_prompt: |
  Survey: "{{ survey_title }}"

  Project context: {{ project_context_json }}
  {%- if tenant_profile_block %}

  {{ tenant_profile_block }}
  {%- endif %}
  {%- if journey_block %}

  {{ journey_block }}
  {%- else %}

  No journey source is available for this tenant — set `journey` to null on EVERY question.
  {%- endif %}

  Project-level dashboard routing (pick dashboard_names from THIS list):
  {%- if project_dashboards %}
  {% for d in project_dashboards -%}
    - {{ d }}
  {% endfor %}
  {%- else %}
    (none — use Customer Experience Dashboard / Employee Engagement Dashboard)
  {%- endif %}

  Questions to classify ({{ questions_count }} non-CM):
  {{ questions_json }}

  Classify each question. Respond with JSON only: {"questions": [...]}
