# Title keyword -> stage-role map (industry-agnostic)
# The journey_stage tagger uses this to set deterministic priors.
# "stage_role" is a semantic slot; the tagger maps it to the industry's actual stage name.
stage_keywords:
  awareness: ["awareness", "discover", "learn about", "first hear"]
  acquisition: ["signup", "sign up", "signing up", "join", "register", "registration", "enroll"]
  onboarding: ["onboarding", "onboard", "getting started", "first week", "first month", "welcome"]
  active_use: ["using", "usage", "current", "day-to-day", "in your role", "experience"]
  service: ["support", "help", "resolution", "ticket", "issue", "contact us"]
  retention: ["retain", "continue", "renew", "renewal", "keep you"]
  advocacy: ["recommend", "refer", "advocate", "promoter", "NPS"]
  churn: ["churn", "cancel", "leave", "unsubscribe", "exit", "offboard"]

# Mapping from generic stage_role to industry-specific stage names.
