# Industry-specific journey stage enums
# The journey_stage tagger selects the list matching the project's industry_vertical.
# Falls back to "_default" if industry is missing from the registry.
# For category in ("Survey", "Assessment") — uses "_generic_survey".

stages:
  "SaaS / Technology":
    - Awareness
    - Trial
    - Onboarding
    - Adoption
    - Expansion
    - Renewal
    - Churn

  Healthcare:
    - Inquiry
    - Admission
    - Treatment
    - Discharge
    - Follow-up

  "Higher Education":
    - Enrollment
    - Orientation
    - Learning
    - Assessment
    - Graduation
    - Alumni

  "K-12 Education":
    - Enrollment
    - Orientation
    - Learning
    - Assessment
    - Graduation

  "Financial Services":
    - Inquiry
    - Application
    - Onboarding
    - Active
    - Service
    - Closure

  "Retail / E-commerce":
    - Awareness
    - Consideration
    - Purchase
    - Delivery
    - Post-Purchase
    - Loyalty

  "Hospitality / Travel":
    - Research
    - Booking
    - Pre-Stay
    - Stay
    - Post-Stay
    - Loyalty

  "Fitness & Wellness":
    - Awareness
    - Enrollment
    - Active Membership
    - Engagement
    - Renewal
    - Churn

  "Government / Public Sector":
    - Inquiry
    - Application
    - Service
    - Resolution
    - Follow-up

  _default:
    - Awareness
    - Consideration
    - Onboarding
    - Active
    - Retention
    - Advocacy
    - Churn

  _generic_survey:
    - Pre-Survey
    - During
    - Post-Survey

# Account-level canonical journey stage lists — used by the Custom Journey projection
# (projections/custom_journey.py) as the default when a tenant has no per-tenant override.
# Per-tenant override path: {data_dir}/{tenant_id}/journey_config.yaml
# Shape of override file: { cx: {journey_name, stages: [...]}, ex: {...} }
_cx_default:
  journey_name: Customer Journey
  stages:
    - name: Awareness
      description: Initial brand or product discovery.
    - name: Consideration
      description: Research and evaluation against alternatives.
    - name: Purchase
      description: Conversion and first transaction.
    - name: Onboarding
      description: First-use setup and activation.
    - name: Service
      description: Ongoing support, interactions, and delivery.
    - name: Retention
      description: Continued engagement and renewal.
    - name: Advocacy
      description: Referral, reviews, loyalty, and promotion.

_ex_default:
  journey_name: Employee Journey
  stages:
    - name: Attract
      description: Employer brand and awareness among prospective employees.
    - name: Recruit
      description: Candidate experience through application and hiring.
    - name: Onboard
      description: First-day through first-90-days ramp-up and integration.
    - name: Engage
      description: Day-to-day engagement, recognition, and culture.
    - name: Develop
      description: Learning, career growth, and performance development.
    - name: Retain
      description: Continued commitment, manager effectiveness, and tenure.
    - name: Exit
      description: Offboarding, alumni relationships, and boomerang potential.

